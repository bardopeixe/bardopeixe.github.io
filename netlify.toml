# Publicação no Netlify (alternativa ao GitHub Pages).
# Gera o cardápio (/), o app do garçom (/garcom/) e o PDV (/pdv/) na pasta dist.
[build]
  command = "npm run build && npm run build:pdv && mkdir -p dist/pdv && cp dist-pdv/pdv.html dist/pdv/index.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cabeçalhos de segurança em todas as páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# O PDV e o garçom não aparecem no Google
[[headers]]
  for = "/pdv/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/garcom/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
